<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Human Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background:#0e0e0e;
    color:#fff;
    font-family:system-ui;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}
#box {
    background:#151515;
    padding:20px;
    border-radius:12px;
    width:360px;
    text-align:center;
}
canvas {
    margin:15px 0;
    background:#000;
    border-radius:8px;
    cursor:pointer;
}
button {
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:#ff8c00;
    font-weight:700;
    cursor:pointer;
}
#status {
    margin-top:10px;
    font-size:14px;
}
</style>
</head>
<body>

<div id="box">
    <h3>Human Verification</h3>
    <p style="font-size:13px;opacity:.8">
        Click the <b>largest rotated letter</b> that is <b>not a vowel</b><br>
        and appears <b>after the color shift</b>.
    </p>

    <canvas id="captcha" width="320" height="160"></canvas>
    <button onclick="verify()">Verify</button>
    <div id="status"></div>
</div>

<script>
const canvas = document.getElementById("captcha");
const ctx = canvas.getContext("2d");
const letters = "ABCDEFGHJKLMNPQRSTVWXYZ";
let objects = [];
let mouseEntropy = 0;
let shiftTime = performance.now() + 1200;
let correctId = null;

canvas.addEventListener("mousemove", e => {
    mouseEntropy += Math.abs(e.movementX) + Math.abs(e.movementY);
});

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function drawCaptcha() {
    ctx.clearRect(0,0,320,160);

    // Noise
    for(let i=0;i<500;i++){
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*.05})`;
        ctx.fillRect(rand(0,320), rand(0,160), 1, 1);
    }

    objects = [];
    correctId = null;

    let now = performance.now();
    let postShift = now > shiftTime;

    for(let i=0;i<6;i++){
        let letter = letters[Math.floor(Math.random()*letters.length)];
        let size = rand(28, 48);
        let rot = rand(-1.2, 1.2);
        let x = rand(40, 280);
        let y = rand(50, 120);

        let isVowel = "AEIOU".includes(letter);
        let color = postShift ? "#ff8c00" : "#4fc3f7";

        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(rot);
        ctx.font = `${size}px serif`;
        ctx.fillStyle = color;
        ctx.fillText(letter,0,0);
        ctx.restore();

        let id = objects.length;
        objects.push({x,y,size,rot,isVowel,postShift,id});

        if(postShift && !isVowel){
            if(!correctId || size > objects[correctId].size){
                correctId = id;
            }
        }
    }
}

canvas.addEventListener("click", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    objects.forEach(o => {
        if(Math.hypot(mx-o.x,my-o.y) < o.size){
            canvas.clickedId = o.id;
        }
    });
});

function verify(){
    const status = document.getElementById("status");

    if(mouseEntropy < 120){
        status.textContent = "❌ Failed (insufficient human movement)";
        status.style.color = "red";
        return;
    }

    if(canvas.clickedId === correctId){
        status.textContent = "✅ Verified as human";
        status.style.color = "lime";
    } else {
        status.textContent = "❌ Incorrect selection";
        status.style.color = "red";
    }
}

drawCaptcha();
setInterval(drawCaptcha, 900);
</script>

</body>
</html>
