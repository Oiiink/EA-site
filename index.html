<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verification</title>
<style>
body {
    background:#0b0b0b;
    color:white;
    font-family:system-ui;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}
#box {
    background:#141414;
    padding:20px;
    border-radius:14px;
    width:460px;
}
#row {
    display:flex;
    gap:20px;
    align-items:center;
}
canvas {
    background:#000;
    border-radius:10px;
}
#fail { color:#ff5555; margin-top:6px; }
#round { font-size:13px; opacity:.8; }
#status { margin-top:10px; font-weight:600; }
</style>
</head>
<body>

<div id="box">
    <h3>Verify You Are Human</h3>
    <div id="round">Round 1 of 3</div>

    <div id="row">
        <canvas id="target" width="90" height="90"></canvas>
        <canvas id="grid" width="270" height="270"></canvas>
    </div>

    <div id="fail">Fails: 0</div>
    <div id="status"></div>
</div>

<script>
const tCanvas = document.getElementById("target");
const gCanvas = document.getElementById("grid");
const tctx = tCanvas.getContext("2d");
const gctx = gCanvas.getContext("2d");

const TYPES = ["square","circle","triangle","cross","diamond"];
const MAX_STEP = 25;
const MIN_TIME = 350;
const MIN_DIST = 120;
const TOTAL_ROUNDS = 3;

let round = 1;
let failCount = 0;
let correctIndex = 0;
let currentType = null;
let gridData = [];
let version = 0;

/* speed samples across all rounds */
let speedSamples = [];

let drag = {
    active:false,
    x:135, y:135,
    lastX:135, lastY:135,
    lastT:0,
    start:0,
    dist:0,
    version:0
};

/* DRAW ICON */
function drawIcon(ctx,type,x,y,s,r){
    ctx.save();
    ctx.translate(x+s/2,y+s/2);
    ctx.rotate(r);
    ctx.fillStyle="#f2f2f2";
    ctx.strokeStyle="#f2f2f2";
    ctx.lineWidth=4;

    if(type==="square") ctx.fillRect(-s/2,-s/2,s,s);
    if(type==="circle"){ctx.beginPath();ctx.arc(0,0,s/2,0,7);ctx.fill();}
    if(type==="triangle"){
        ctx.beginPath();
        ctx.moveTo(0,-s/2);
        ctx.lineTo(s/2,s/2);
        ctx.lineTo(-s/2,s/2);
        ctx.closePath();
        ctx.fill();
    }
    if(type==="cross"){
        ctx.beginPath();
        ctx.moveTo(-s/2,0);ctx.lineTo(s/2,0);
        ctx.moveTo(0,-s/2);ctx.lineTo(0,s/2);
        ctx.stroke();
    }
    if(type==="diamond"){
        ctx.beginPath();
        ctx.moveTo(0,-s/2);
        ctx.lineTo(s/2,0);
        ctx.lineTo(0,s/2);
        ctx.lineTo(-s/2,0);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

/* REDRAW */
function redraw(){
    gctx.clearRect(0,0,270,270);
    gridData.forEach((o,i)=>{
        drawIcon(gctx,o.type,(i%3)*90+15,Math.floor(i/3)*90+15,60,o.rot);
    });

    gctx.beginPath();
    gctx.arc(drag.x,drag.y,16,0,7);
    gctx.strokeStyle="#ff8c00";
    gctx.lineWidth=3;
    gctx.stroke();
}

/* GENERATE ROUND */
function generate(){
    version++;
    drag={active:false,x:135,y:135,lastX:135,lastY:135,lastT:0,start:0,dist:0,version};

    tctx.clearRect(0,0,90,90);
    currentType=TYPES[Math.floor(Math.random()*TYPES.length)];
    correctIndex=Math.floor(Math.random()*9);
    drawIcon(tctx,currentType,15,15,60,Math.random());

    gridData=[];
    for(let i=0;i<9;i++){
        gridData.push({
            type:i===correctIndex?currentType:TYPES[Math.floor(Math.random()*TYPES.length)],
            rot:Math.random()-0.5
        });
    }
    redraw();
}

/* DRAG */
gCanvas.addEventListener("mousedown",e=>{
    const r=gCanvas.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    if(Math.hypot(mx-drag.x,my-drag.y)<18){
        drag.active=true;
        drag.start=performance.now();
        drag.lastT=drag.start;
        drag.version=version;
    }
});

gCanvas.addEventListener("mousemove",e=>{
    if(!drag.active||drag.version!==version) return;

    const r=gCanvas.getBoundingClientRect();
    const nx=e.clientX-r.left,ny=e.clientY-r.top;
    const now=performance.now();

    const dx=nx-drag.lastX, dy=ny-drag.lastY;
    const dist=Math.hypot(dx,dy);
    const dt=now-drag.lastT;

    if(dist>MAX_STEP) return fail();

    if(dt>0){
        speedSamples.push(dist/dt);
    }

    drag.dist+=dist;
    drag.x=nx; drag.y=ny;
    drag.lastX=nx; drag.lastY=ny;
    drag.lastT=now;
    redraw();
});

document.addEventListener("mouseup",()=>{
    if(!drag.active) return;
    drag.active=false;

    if(performance.now()-drag.start<MIN_TIME||drag.dist<MIN_DIST){
        return fail();
    }

    const idx=Math.floor(drag.y/90)*3+Math.floor(drag.x/90);
    if(idx===correctIndex){
        nextRound();
    } else fail();
});

/* ROUND CONTROL */
function nextRound(){
    if(round<TOTAL_ROUNDS){
        round++;
        document.getElementById("round").textContent=`Round ${round} of ${TOTAL_ROUNDS}`;
        generate();
    } else {
        analyzeBehavior();
    }
}

/* ANALYSIS */
function analyzeBehavior(){
    const avg=speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length;
    const variance=speedSamples.reduce((a,b)=>a+(b-avg)**2,0)/speedSamples.length;

    const status=document.getElementById("status");
    if(variance<0.0005){
        status.textContent="❌ Behavior too consistent — likely automated";
        status.style.color="#ff5555";
    } else {
        status.textContent="✅ Human-like interaction detected";
        status.style.color="lime";
    }
}

/* FAIL */
function fail(){
    failCount++;
    document.getElementById("fail").textContent="Fails: "+failCount;
    generate();
}

/* INIT */
generate();
</script>

</body>
</html>
