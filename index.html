<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background:#0b0b0b;
    color:white;
    font-family:system-ui;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}
#box {
    background:#141414;
    padding:20px;
    border-radius:14px;
    width:420px;
}
h3 {
    margin:0 0 10px;
}
#row {
    display:flex;
    gap:20px;
}
canvas {
    background:#000;
    border-radius:10px;
}
#info {
    margin-top:10px;
    font-size:13px;
    opacity:.8;
}
#fail {
    margin-top:6px;
    font-size:14px;
    color:#ff5555;
}
</style>
</head>
<body>

<div id="box">
    <h3>Verify You Are Human</h3>
    <p id="info">Click the matching icon</p>

    <div id="row">
        <canvas id="target" width="90" height="90"></canvas>
        <canvas id="grid" width="270" height="270"></canvas>
    </div>

    <div id="fail">Fails: 0</div>
</div>

<script>
const targetCanvas = document.getElementById("target");
const gridCanvas = document.getElementById("grid");
const tctx = targetCanvas.getContext("2d");
const gctx = gridCanvas.getContext("2d");

let failCount = 0;
let correctIndex = 0;
let icons = [];

/* --- ICON DRAWING --- */
function drawIcon(ctx, type, x, y, size, rot) {
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    ctx.rotate(rot);
    ctx.fillStyle = "#f2f2f2";
    ctx.strokeStyle = "#f2f2f2";
    ctx.lineWidth = 4;

    switch(type) {
        case "square":
            ctx.fillRect(-size/2, -size/2, size, size);
            break;
        case "circle":
            ctx.beginPath();
            ctx.arc(0,0,size/2,0,Math.PI*2);
            ctx.fill();
            break;
        case "triangle":
            ctx.beginPath();
            ctx.moveTo(0,-size/2);
            ctx.lineTo(size/2,size/2);
            ctx.lineTo(-size/2,size/2);
            ctx.closePath();
            ctx.fill();
            break;
        case "cross":
            ctx.beginPath();
            ctx.moveTo(-size/2,0);
            ctx.lineTo(size/2,0);
            ctx.moveTo(0,-size/2);
            ctx.lineTo(0,size/2);
            ctx.stroke();
            break;
        case "diamond":
            ctx.beginPath();
            ctx.moveTo(0,-size/2);
            ctx.lineTo(size/2,0);
            ctx.lineTo(0,size/2);
            ctx.lineTo(-size/2,0);
            ctx.closePath();
            ctx.fill();
            break;
    }
    ctx.restore();
}

/* --- GENERATE CAPTCHA --- */
function generateCaptcha() {
    tctx.clearRect(0,0,90,90);
    gctx.clearRect(0,0,270,270);

    const types = ["square","circle","triangle","cross","diamond"];
    const targetType = types[Math.floor(Math.random()*types.length)];
    correctIndex = Math.floor(Math.random()*9);

    icons = [];

    drawIcon(tctx, targetType, 15, 15, 60, Math.random());

    for(let i=0;i<9;i++){
        let type = i === correctIndex
            ? targetType
            : types[Math.floor(Math.random()*types.length)];

        let x = (i % 3) * 90;
        let y = Math.floor(i / 3) * 90;

        let rot = (Math.random() - 0.5);
        icons.push({x,y,type});

        drawIcon(gctx, type, x+15, y+15, 60, rot);
    }
}

/* --- CLICK HANDLING --- */
gridCanvas.addEventListener("click", e => {
    const rect = gridCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const col = Math.floor(x / 90);
    const row = Math.floor(y / 90);
    const index = row * 3 + col;

    if(index === correctIndex){
        document.getElementById("info").textContent = "✅ Verified";
        document.getElementById("info").style.color = "lime";
    } else {
        failCount++;
        document.getElementById("fail").textContent = "Fails: " + failCount;
        generateCaptcha();
    }
});

generateCaptcha();
</script>

</body>
</html>
