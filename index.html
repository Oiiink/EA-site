<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bee</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:#87ceeb;
      font-family:Arial, sans-serif;
    }

    canvas{
      display:block;
      margin:auto;
      background:
        linear-gradient(to bottom,#87ceeb 0%,#b8ecff 65%,#7ad66f 65%,#69c55f 100%);
    }

    .ui{
      position:fixed;
      top:20px;
      width:100%;
      text-align:center;
      color:white;
      text-shadow:2px 2px 6px rgba(0,0,0,0.4);
      pointer-events:none;
    }

    .title{
      font-size:42px;
      font-weight:bold;
    }

    .subtitle{
      margin-top:8px;
      font-size:18px;
    }

    .score{
      margin-top:16px;
      font-size:28px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="ui">
  <div class="title">🐝 Flappy Bee</div>
  <div class="subtitle">Press SPACE or CLICK to fly</div>
  <div class="score">Score: <span id="score">0</span></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 480;
canvas.height = 720;

const scoreText = document.getElementById("score");

let gameStarted = false;
let gameOver = false;
let score = 0;

const gravity = 0.45;
const flap = -8;

const bee = {
  x: 120,
  y: 300,
  radius: 22,
  velocity: 0,
  rotation: 0
};

const pipes = [];
const pipeWidth = 90;
const pipeGap = 180;
const pipeSpeed = 3;

function createPipe(){
  const topHeight =
    Math.floor(Math.random() * 260) + 80;

  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - pipeGap,
    passed: false
  });
}

function drawBee(){

  ctx.save();

  ctx.translate(bee.x, bee.y);

  bee.rotation = bee.velocity * 0.05;
  ctx.rotate(bee.rotation);

  // wings
  ctx.fillStyle = "rgba(255,255,255,0.8)";

  ctx.beginPath();
  ctx.ellipse(-8,-18,12,18,-0.4,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(10,-18,12,18,0.4,0,Math.PI*2);
  ctx.fill();

  // body
  ctx.fillStyle = "#ffd93b";

  ctx.beginPath();
  ctx.arc(0,0,22,0,Math.PI*2);
  ctx.fill();

  // stripes
  ctx.fillStyle = "#222";

  ctx.fillRect(-18,-10,36,6);
  ctx.fillRect(-18,5,36,6);

  // eyes
  ctx.fillStyle = "#fff";

  ctx.beginPath();
  ctx.arc(8,-5,5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#000";

  ctx.beginPath();
  ctx.arc(10,-5,2,0,Math.PI*2);
  ctx.fill();

  // smile
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.arc(0,4,8,0,Math.PI);
  ctx.stroke();

  // stinger
  ctx.fillStyle = "#222";

  ctx.beginPath();
  ctx.moveTo(-22,0);
  ctx.lineTo(-34,-5);
  ctx.lineTo(-34,5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawPipes(){

  pipes.forEach(pipe => {

    // top pipe
    ctx.fillStyle = "#46b04a";

    ctx.fillRect(pipe.x,0,pipeWidth,pipe.top);

    // bottom pipe
    ctx.fillRect(
      pipe.x,
      canvas.height - pipe.bottom,
      pipeWidth,
      pipe.bottom
    );

    // highlights
    ctx.fillStyle = "#6fe874";

    ctx.fillRect(pipe.x + 8,0,10,pipe.top);

    ctx.fillRect(
      pipe.x + 8,
      canvas.height - pipe.bottom,
      10,
      pipe.bottom
    );
  });
}

function drawCloud(x,y,size){

  ctx.fillStyle = "rgba(255,255,255,0.9)";

  ctx.beginPath();
  ctx.arc(x,y,size,0,Math.PI*2);
  ctx.arc(x+size,y+5,size*0.8,0,Math.PI*2);
  ctx.arc(x-size,y+5,size*0.7,0,Math.PI*2);
  ctx.fill();
}

function update(){

  if(gameOver) return;

  requestAnimationFrame(update);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // clouds
  drawCloud(90,120,28);
  drawCloud(350,180,24);
  drawCloud(250,80,18);

  if(gameStarted){

    bee.velocity += gravity;
    bee.y += bee.velocity;

    // spawn pipes
    if(frames % 100 === 0){
      createPipe();
    }

    pipes.forEach(pipe => {

      pipe.x -= pipeSpeed;

      // score
      if(!pipe.passed && pipe.x + pipeWidth < bee.x){
        pipe.passed = true;
        score++;
        scoreText.textContent = score;
      }

      // collision
      if(
        bee.x + bee.radius > pipe.x &&
        bee.x - bee.radius < pipe.x + pipeWidth &&
        (
          bee.y - bee.radius < pipe.top ||
          bee.y + bee.radius >
          canvas.height - pipe.bottom
        )
      ){
        endGame();
      }

    });

    // remove old pipes
    while(pipes.length && pipes[0].x < -pipeWidth){
      pipes.shift();
    }

    // ground collision
    if(
      bee.y + bee.radius > canvas.height ||
      bee.y - bee.radius < 0
    ){
      endGame();
    }
  }

  drawPipes();
  drawBee();

  if(!gameStarted){

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.font = "bold 40px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      "CLICK TO START",
      canvas.width / 2,
      canvas.height / 2
    );
  }

  frames++;
}

function flapBee(){

  if(gameOver){
    location.reload();
    return;
  }

  gameStarted = true;
  bee.velocity = flap;
}

function endGame(){

  gameOver = true;

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 56px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    "GAME OVER",
    canvas.width/2,
    canvas.height/2 - 20
  );

  ctx.font = "32px Arial";

  ctx.fillText(
    "Final Score: " + score,
    canvas.width/2,
    canvas.height/2 + 40
  );

  ctx.font = "22px Arial";

  ctx.fillText(
    "Click to Restart",
    canvas.width/2,
    canvas.height/2 + 90
  );
}

let frames = 0;

document.addEventListener("keydown", e => {
  if(e.code === "Space"){
    flapBee();
  }
});

document.addEventListener("mousedown", flapBee);
document.addEventListener("touchstart", flapBee);

update();

</script>

</body>
</html>
