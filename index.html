<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verification</title>
<style>
body{
    background:#0b0b0b;
    color:white;
    font-family:system-ui;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}
#box{
    background:#141414;
    padding:20px;
    border-radius:14px;
    width:480px;
}
#row{
    display:flex;
    gap:20px;
    align-items:center;
}
canvas{
    background:#000;
    border-radius:10px;
}
#round{font-size:13px;opacity:.8}
#fail{color:#ff5555;margin-top:6px}
#status{margin-top:10px;font-weight:600}
#timer{font-size:12px;opacity:.6}
</style>
</head>
<body>

<div id="box">
    <h3>Verify You Are Human</h3>
    <div id="round">Round 1 of 3</div>

    <div id="row">
        <canvas id="target" width="90" height="90"></canvas>
        <canvas id="grid" width="270" height="270"></canvas>
    </div>

    <div id="timer"></div>
    <div id="fail">Fails: 0</div>
    <div id="status"></div>
</div>

<script>
const tCanvas=document.getElementById("target");
const gCanvas=document.getElementById("grid");
const tctx=tCanvas.getContext("2d");
const gctx=gCanvas.getContext("2d");

const SHAPES=[
 "circle","square","rectangle","triangle",
 "trapezoid","rhombus","hexagon","octagon"
];

const TOTAL_ROUNDS=3;
const ROUND_TIME=4000;
const MAX_STEP=28;
const MIN_TIME=450;
const MIN_DIST=160;

let round=1,failCount=0,correctIndex=0,version=0;
let gridData=[],currentShape=null,roundStart=0;
let speeds=[],angles=[],accelerations=[],pathPoints=[];

let drag={
 active:false,x:135,y:135,lastX:135,lastY:135,lastT:0,start:0,dist:0,version:0
};

/* ---------- SHAPE DRAWING ---------- */
function poly(ctx,pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function drawShape(ctx,type,x,y,s,r){
 ctx.save();ctx.translate(x+s/2,y+s/2);ctx.rotate(r);
 ctx.fillStyle="#f2f2f2";ctx.strokeStyle="#f2f2f2";ctx.lineWidth=4;

 if(type==="circle"){ctx.beginPath();ctx.arc(0,0,s/2,0,7);ctx.fill()}
 if(type==="square") ctx.fillRect(-s/2,-s/2,s,s)
 if(type==="rectangle") ctx.fillRect(-s/2,-s/3,s,s*0.66)
 if(type==="triangle") poly(ctx,[[0,-s/2],[s/2,s/2],[-s/2,s/2]])
 if(type==="trapezoid") poly(ctx,[[-s/3,-s/2],[s/3,-s/2],[s/2,s/2],[-s/2,s/2]])
 if(type==="rhombus") poly(ctx,[[0,-s/2],[s/2,0],[0,s/2],[-s/2,0]])
 if(type==="hexagon") poly(ctx,[[-s/4,-s/2],[s/4,-s/2],[s/2,0],[s/4,s/2],[-s/4,s/2],[-s/2,0]])
 if(type==="octagon") poly(ctx,[[-s/4,-s/2],[s/4,-s/2],[s/2,-s/4],[s/2,s/4],[s/4,s/2],[-s/4,s/2],[-s/2,s/4],[-s/2,-s/4]])
 ctx.restore();
}

/* ---------- RENDER ---------- */
function redraw(){
 gctx.clearRect(0,0,270,270);
 gridData.forEach((o,i)=>drawShape(gctx,o.type,(i%3)*90+15,Math.floor(i/3)*90+15,60,o.rot));
 gctx.beginPath();gctx.arc(drag.x,drag.y,16,0,7);
 gctx.strokeStyle="#ff8c00";gctx.lineWidth=3;gctx.stroke();
}

/* ---------- GENERATE ROUND ---------- */
function generate(){
 version++;
 drag={active:false,x:135,y:135,lastX:135,lastY:135,lastT:0,start:0,dist:0,version};
 roundStart=performance.now();
 document.getElementById("timer").textContent="Time: 4.0s";

 tctx.clearRect(0,0,90,90);
 currentShape=SHAPES[Math.floor(Math.random()*SHAPES.length)];
 correctIndex=Math.floor(Math.random()*9);
 drawShape(tctx,currentShape,15,15,60,Math.random());

 gridData=[];
 for(let i=0;i<9;i++){
   gridData.push({type:i===correctIndex?currentShape:SHAPES[Math.floor(Math.random()*SHAPES.length)],rot:Math.random()-0.5});
 }
 redraw();
}

/* ---------- DRAG ---------- */
gCanvas.addEventListener("mousedown",e=>{
 const r=gCanvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 if(Math.hypot(mx-drag.x,my-drag.y)<18){
   drag.active=true;drag.start=performance.now();drag.lastT=drag.start;drag.version=version;
   pathPoints.push([drag.x,drag.y]);
 }
});

gCanvas.addEventListener("mousemove",e=>{
 if(!drag.active||drag.version!==version) return;
 const r=gCanvas.getBoundingClientRect(),nx=e.clientX-r.left,ny=e.clientY-r.top,now=performance.now();
 const dx=nx-drag.lastX,dy=ny-drag.lastY,dist=Math.hypot(dx,dy),dt=now-drag.lastT;
 if(dist>MAX_STEP) return fail();
 if(dt>0){
   speeds.push(dist/dt);
   if(speeds.length>1) accelerations.push((dist/dt)-speeds[speeds.length-2]);
   angles.push(Math.atan2(dy,dx));
 }
 drag.dist+=dist;drag.x=nx;drag.y=ny;drag.lastX=nx;drag.lastY=ny;drag.lastT=now;
 pathPoints.push([nx,ny]);
 redraw();
});

document.addEventListener("mouseup",()=>{
 if(!drag.active) return;drag.active=false;
 if(performance.now()-drag.start<MIN_TIME||drag.dist<MIN_DIST) return fail();
 const idx=Math.floor(drag.y/90)*3+Math.floor(drag.x/90);
 idx===correctIndex?nextRound():fail();
});

/* ---------- ROUND / ANALYSIS ---------- */
function variance(arr){
 const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
 return arr.reduce((a,b)=>a+(b-avg)**2,0)/arr.length;
}
function nextRound(){
 if(round<TOTAL_ROUNDS){
   round++;document.getElementById("round").textContent=`Round ${round} of ${TOTAL_ROUNDS}`;
   generate();
 } else analyze();
}
function analyze(){
 const speedVar=variance(speeds);
 const accelVar=variance(accelerations);
 const angleVar=variance(angles);
 const straightDist=Math.hypot(pathPoints[0][0]-pathPoints.at(-1)[0],pathPoints[0][1]-pathPoints.at(-1)[1]);
 const efficiency=straightDist/(drag.dist||1);

 const status=document.getElementById("status");
 if(speedVar<0.0006||accelVar<0.0002||angleVar<0.001||efficiency>0.98){
   status.textContent="❌ Bot-like movement detected";
   status.style.color="#ff5555";
 } else {
   status.textContent="✅ Human-like behavior verified";
   status.style.color="lime";
 }
}

/* ---------- FAIL ---------- */
function fail(){
 failCount++;
 document.getElementById("fail").textContent="Fails: "+failCount;
 generate();
}

/* ---------- TIMER ---------- */
setInterval(()=>{
 const t=ROUND_TIME-(performance.now()-roundStart);
 if(t<=0) fail();
 document.getElementById("timer").textContent="Time: "+(t/1000).toFixed(1)+"s";
},100);

generate();
</script>

</body>
</html>
